<!doctype html>
<html lang="pt-BR">
  <head>

    <meta name="theme-color" content="#302f2a" />
    <title>Fiorella offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;

        padding: 24px;

        border-radius: 9px;

  <body>
    <main>
      <p>FIORELLA</p>
      <h1>Você está offline</h1>

    </main>

</html>
